name: Deploy to VPS

on:
  # Production is VPS-first. GitHub must never overwrite the live site on push.
  # This workflow remains available only as a manual, non-deleting fallback.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Incrementally deploy new/ to VPS (never delete live-only files)
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "new/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: "/var/www/chinapartnerhub/"
          EXCLUDE: "/.git/"
