server {
    listen 80;
    listen [::]:80;
    server_name www.chinapartnerhub.com chinapartnerhub.com;

    return 301 https://chinapartnerhub.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.chinapartnerhub.com;

    ssl_certificate /etc/ssl/cloudflare/chinapartnerhub.crt;
    ssl_certificate_key /etc/ssl/cloudflare/chinapartnerhub.key;

    return 301 https://chinapartnerhub.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chinapartnerhub.com;

    ssl_certificate /etc/ssl/cloudflare/chinapartnerhub.crt;
    ssl_certificate_key /etc/ssl/cloudflare/chinapartnerhub.key;

    root /var/www/chinapartnerhub;
    index index.html;

    # Consolidate the retired playbook duplicate into the stronger Insights URL.
    location = /playbook/p/alibaba-vs-made-in-china-vs-direct-factory.html {
        return 301 /insights/alibaba-vs-made-in-china-vs-direct-factory.html;
    }
    location = /playbook/p/alibaba-vs-made-in-china-vs-direct-factory {
        return 301 /insights/alibaba-vs-made-in-china-vs-direct-factory.html;
    }

    location = /api/lead {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
